name: Scaffold Capacitor platforms

# One-shot: install Capacitor, generate ios/ and android/, commit them, and delete this workflow.
on:
  push:
    branches: [capacitor/scaffold]
    paths:
      - .github/workflows/scaffold-capacitor.yml

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm install @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/ios@8.5.2
      - run: npm install -D @capacitor/cli@8.5.2
      - run: npx cap init "Family Book Club" com.wrigh4d.familybookclub --web-dir dist
      - run: npx prettier --write capacitor.config.ts
      - run: npx cap add android
      - run: npx cap add ios
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit platform projects
        run: |
          set -euo pipefail
          git config user.name "David Wright"
          git config user.email "115506753+wrigh4d@users.noreply.github.com"
          git config core.autocrlf false
          git config core.filemode true
          rm -f .github/workflows/scaffold-capacitor.yml
          git add -A
          git update-index --chmod=+x android/gradlew
          git status --short
          git commit -m "Scaffold Capacitor for iOS and Android" -m "Install @capacitor/core, cli, android, and ios 8.5.2. Init app id com.wrigh4d.familybookclub, name Family Book Club, webDir dist. Add the native ios/ and android/ projects. No push or UI changes." -m "Closes #32."
          git push origin HEAD:capacitor/scaffold
          git push origin --delete capacitor/scaffold-ios-android || true
